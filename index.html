```html
<!DOCTYPE html>
<html>
<body>
<h2>MongoDB Atlas CRUD</h2>

<input id="id" placeholder="Task ID">
<br><br>
<input id="title" placeholder="Task Title">
<br><br>
<input id="summary" placeholder="Task Summary">
<br><br>

<button onclick="createTask()">Create</button>
<button onclick="readTasks()">Read</button>
<button onclick="updateTask()">Update</button>
<button onclick="deleteTask()">Delete</button>

<pre id="result"></pre>

<script>
const url = "http://localhost:5000/tasks";

async function createTask() {
  let r = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      title: title.value,
      summary: summary.value
    })
  });
  result.textContent = JSON.stringify(await r.json(), null, 2);
}

async function readTasks() {
  let r = await fetch(url);
  result.textContent = JSON.stringify(await r.json(), null, 2);
}

async function updateTask() {
  let r = await fetch(url + "/" + id.value, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      title: title.value,
      summary: summary.value
    })
  });
  result.textContent = JSON.stringify(await r.json(), null, 2);
}

async function deleteTask() {
  let r = await fetch(url + "/" + id.value, {
    method: "DELETE"
  });
  result.textContent = JSON.stringify(await r.json(), null, 2);
}
</script>
</body>
</html>
